<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent Incident Tracker</title>
<script src="assets/chart.min.js"></script>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --border:#2a2e37; --txt:#e8eaed; --dim:#9aa0a6; --acc:#4c9aff; --warn:#ffb74d; --critical:#ff5252; --high:#ff8a65; --medium:#ffd54f; --low:#81c784; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:20px; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; margin-bottom:24px; border-bottom:1px solid var(--border); padding-bottom:14px; }
  h1 { font-size:22px; font-weight:600; }
  .sub { color:var(--dim); font-size:13px; margin-top:4px; }
  .statrow { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 18px; min-width:150px; flex:1; }
  .stat .n { font-size:26px; font-weight:700; color:var(--acc); }
  .stat .l { font-size:12px; color:var(--dim); margin-top:2px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; }
  .tab-btn { background:var(--card); border:1px solid var(--border); color:var(--txt); padding:8px 14px; border-radius:8px; cursor:pointer; font-size:13px; }
  .tab-btn.active { background:var(--acc); border-color:var(--acc); color:#fff; }
  .panel { display:none; }
  .panel.active { display:block; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:16px; }
  .card h3 { font-size:15px; margin-bottom:12px; color:var(--txt); }
  .chartbox { position:relative; height:320px; }
  .tip { color:var(--dim); font-size:12px; margin-top:8px; }
  ul { list-style:none; }
  li { padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; line-height:1.5; }
  li:last-child { border-bottom:none; }
  .pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; margin-right:6px; }
  .sev-critical{background:var(--critical);color:#fff;} .sev-high{background:var(--high);color:#000;} .sev-medium{background:var(--medium);color:#000;} .sev-low{background:var(--low);color:#000;}
  a { color:var(--acc); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .src { color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>🤖 AI Agent Incident Tracker</h1>
    <div class="sub" id="header-sub">Loading…</div>
  </div>
  <div class="statrow" style="margin:0;flex:0 0 auto;">
    <div class="stat"><div class="n" id="stat-incidents">—</div><div class="l">incidents</div></div>
    <div class="stat"><div class="n" id="stat-lag">—</div><div class="l">median disclosure lag (days)</div></div>
    <div class="stat"><div class="n" id="stat-new7">—</div><div class="l">new this week</div></div>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<div id="panels"></div>

<script src="assets/data.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
